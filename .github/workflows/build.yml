name: Build DB Designer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  engines:
    name: Exported SQL on real engines (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest versions we promise to support
          - name: PostgreSQL 16 · SQL Server 2022 · MySQL 8.4
            pg: postgres:16-alpine
            mssql: mcr.microsoft.com/mssql/server:2022-latest
            mysql: mysql:8.4
            mysql_health: mysqladmin ping -uroot -perdtest
            mssql2025: ''
          # Latest releases: PostgreSQL 18 (+ pgvector), SQL Server 2025 (runs both SQL Server targets), MySQL 9
          - name: PostgreSQL 18 · SQL Server 2025 · MySQL 9
            pg: pgvector/pgvector:pg18
            mssql: mcr.microsoft.com/mssql/server:2025-latest
            mysql: mysql:9
            mysql_health: mysqladmin ping -uroot -perdtest
            mssql2025: 'mssql://sa:Erd_Test_Pw_2026!@127.0.0.1:51433'
          - name: MariaDB latest
            pg: pgvector/pgvector:pg18
            mssql: mcr.microsoft.com/mssql/server:2025-latest
            mysql: mariadb:latest
            mysql_health: healthcheck.sh --connect --innodb_initialized
            mssql2025: 'mssql://sa:Erd_Test_Pw_2026!@127.0.0.1:51433'
            only: mysql
    services:
      postgres:
        image: ${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: test
        ports: ['55999:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: erdtest
          MARIADB_ROOT_PASSWORD: erdtest
        ports: ['53306:3306']
        options: >-
          --health-cmd "${{ matrix.mysql_health }}" --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: ${{ matrix.mssql }}
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Erd_Test_Pw_2026!
        ports: ['51433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Erd_Test_Pw_2026!' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:engines
        env:
          MSSQL2025_URL: ${{ matrix.mssql2025 }}
          ENGINES: ${{ matrix.only }}

  package:
    name: Package VSIX
    needs: [test, engines]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Package extension
        id: vsix
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match package version v$version." >&2
            exit 1
          fi
          filename="db-designer-vs-$version.vsix"
          npm run package -- --out "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: db-designer-vs-vsix
          path: ${{ steps.vsix.outputs.filename }}
          if-no-files-found: error
    outputs:
      filename: ${{ steps.vsix.outputs.filename }}
      tag: ${{ steps.vsix.outputs.tag }}

  release:
    name: Publish GitHub release
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.package.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: db-designer-vs-vsix
      - name: Publish VSIX
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VSIX: ${{ needs.package.outputs.filename }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          target=$(git rev-parse HEAD)
          if tagged=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            if [[ "$tagged" != "$target" ]]; then
              echo "$TAG already points to $tagged. Bump the package version to release this commit."
              exit 0
            fi
            create_options=(--verify-tag)
          else
            create_options=(--target "$target")
          fi
          if release=$(gh release view "$TAG" --json assets,isDraft,targetCommitish); then
            if [[ -z "$tagged" ]] && ! jq -e --arg commit "$target" '.targetCommitish == $commit' <<< "$release" >/dev/null; then
              echo "The draft for $TAG targets a different commit." >&2
              exit 1
            fi
            if jq -e --arg asset "$VSIX" 'any(.assets[]; .name == $asset and .state == "uploaded")' <<< "$release" >/dev/null; then
              echo "$VSIX is already attached to $TAG."
            else
              gh release upload "$TAG" "$VSIX" --clobber
            fi
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" "$VSIX" "${create_options[@]}" --generate-notes
          fi
